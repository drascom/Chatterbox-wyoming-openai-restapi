services:
  chatterbox-tts:
    image: drascom07/chatterbox-wyoming-openai-restapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "server.py"]
    ports:
      - "${PORT:-8001}:8000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./voices:/app/voices
      - ./reference_audio:/app/reference_audio
      - ./outputs:/app/outputs
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    networks:
      - speech-net

  whisper-stt:
    image: drascom07/chatterbox-wyoming-openai-restapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "stt_http_server.py"]
    ports:
      - "${STT_API_PORT:-8000}:10400"
    expose:
      - "10400"
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    networks:
      - speech-net

  wyoming-gateway:
    image: drascom07/chatterbox-wyoming-openai-restapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python3", "wyoming_gateway.py"]
    profiles: ["wyoming"]
    ports:
      - "${WYOMING_PORT:-10200}:10200"
      - "${WHISPER_PORT:-10300}:10300"
    volumes:
      - ./voices:/app/voices:ro
      - ./reference_audio:/app/reference_audio:ro
      - ./logs:/app/logs
    restart: unless-stopped
    environment:
      - TTS_UPSTREAM_URL=${TTS_UPSTREAM_URL:-http://chatterbox-tts:8000}
      - STT_UPSTREAM_URL=${STT_UPSTREAM_URL:-http://whisper-stt:10400}
      - WYOMING_TTS_HOST=${WYOMING_TTS_HOST:-0.0.0.0}
      - WYOMING_TTS_PORT=${WYOMING_TTS_PORT:-10200}
      - WYOMING_STT_HOST=${WYOMING_STT_HOST:-0.0.0.0}
      - WYOMING_STT_PORT=${WYOMING_STT_PORT:-10300}
      - WYOMING_ENABLE_TTS=${WYOMING_ENABLE_TTS:-true}
      - WYOMING_ENABLE_STT=${WYOMING_ENABLE_STT:-true}
      - WYOMING_ADVERTISE_NAME=${WYOMING_ADVERTISE_NAME:-Chatterbox TTS (Wyoming)}
    depends_on:
      - chatterbox-tts
      - whisper-stt
    networks:
      - speech-net

networks:
  speech-net:
    driver: bridge
